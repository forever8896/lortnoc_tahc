# The gate on fly.io — holds key shares for time / World ID / NFT rules and answers /unlock.
# Deploy from the REPO ROOT:  flyctl deploy --config gate/fly.toml --dockerfile gate/Dockerfile
#
# ONE machine, always on: the SQLite database (gate key, deposits, keyring sessions) is on a single
# volume, and World ID nonces must be answered by the process that issued them.
app = "lortnoc-gate"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  WORLD_ENV = "sandbox,staging"   # phones → sandbox; the simulator → staging (gate/world.mjs)

[[mounts]]
  source = "gate_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
