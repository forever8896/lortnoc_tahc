<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lortnoc tahc — everywhere</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    body { width: 300px; background: #08080a; } .card { border: 0; border-radius: 0; }
    .big { width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; }
    details { margin-top: 14px; } summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr"><div class="title">lortnoc <b>tahc</b></div><span class="chip" id="health">…</span></div>
    <button class="btn big" id="compose">Write hidden</button>
    <button class="btn btn-ghost big" id="scan">Find hidden posts</button>
    <div class="small muted" style="margin-top:8px">Or <b id="key">Ctrl+Shift+L</b> in any text box · right-click text → Reveal</div>
    <label class="toggle" id="siteRow" style="margin-top:12px" hidden><input type="checkbox" id="site"> <span>Always on for <b id="siteName"></b> <span class="muted">— a 🔒 appears when you click a text box</span></span></label>
    <div class="status" id="status"></div>
    <details>
      <summary>Settings</summary>
      <div class="eyebrow">Your spaces</div>
      <div class="row"><input type="text" id="spaceName" placeholder="new-space-name" spellcheck="false"><button class="btn btn-ghost btn-small" id="createSpace">Create</button></div>
      <div class="small" id="spaceList" style="margin-top:6px"></div>
      <div class="eyebrow">ENS spaces</div>
      <div class="row"><input type="text" id="ensName" placeholder="name  (→ name.space.lortnoctahc.eth)" spellcheck="false"><button class="btn btn-ghost btn-small" id="addEns">Add</button></div>
      <div class="small" id="ensList" style="margin-top:6px"></div>
      <div class="eyebrow">Buy a space · 0.005 ETH</div>
      <div class="small muted" style="margin-bottom:6px">A real ENS name for your community, gated by your NFT collection. Your wallet on this page pays.</div>
      <input type="text" id="buyName" placeholder="name" spellcheck="false" style="margin-bottom:6px">
      <input type="text" id="buyToken" placeholder="NFT: eip155:11155111/erc721:0x…" spellcheck="false" style="margin-bottom:6px">
      <div class="row"><select id="buyChain"><option value="11155111">Sepolia (demo)</option><option value="1">Ethereum mainnet</option></select><button class="btn btn-small" id="buy">Buy</button></div>
      <div class="small" id="buyState" style="margin-top:6px"></div>
      <div class="eyebrow">Codec</div>
      <div class="row"><input type="text" id="codec" spellcheck="false"><button class="btn btn-ghost btn-small" id="save">Save</button></div>
    </details>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
