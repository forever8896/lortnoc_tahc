<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lortnoc tahc — everywhere</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    :root, :root body { background: #08080a; } body { width: 300px; } .card { border: 0; border-radius: 0; }
    .big { width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; }
    .cog { background: none; border: 1px solid var(--rule); color: var(--muted); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; }
    .cog:hover { color: var(--signal); border-color: var(--signal); }
    .keys { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); color: var(--ink); text-decoration: none; font-size: 12.5px; }
    .keys:hover { border-color: var(--signal); } .keys .go { color: var(--signal); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="title">lortnoc <b>tahc</b></div>
      <div class="row" style="gap:6px"><span class="chip" id="health">…</span><button class="cog" id="settings" title="Keys, spaces, sites and settings">⚙</button></div>
    </div>
    <button class="btn big" id="compose">Write hidden</button>
    <button class="btn btn-ghost big" id="scan">Find hidden posts</button>
    <div class="small muted" style="margin-top:8px">Or <b id="key">Ctrl+Shift+L</b> in any text box · right-click text → Reveal</div>
    <label class="toggle" id="siteRow" style="margin-top:12px" hidden><input type="checkbox" id="site"> <span>Always on for <b id="siteName"></b> <span class="muted">— checks every page for posts meant for you</span></span></label>
    <a href="#" class="keys" id="keys"><span id="keySummary">Your keys…</span><span class="go">Manage →</span></a>
    <div class="status" id="status"></div>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
