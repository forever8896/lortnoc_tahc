<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lortnoc tahc — reveal</title>
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="title">lortnoc <b>tahc</b> — reveal</div>
      <button class="x" id="close" title="Close (Esc)">×</button>
    </div>
    <div class="status" id="status">Reading…</div>
    <div id="needs" hidden>
      <div class="eyebrow">This post asks for</div>
      <div class="chips" id="checks"></div>
      <div id="pass" hidden>
        <div class="row">
          <input type="password" id="pw" placeholder="Passphrase" autocomplete="off">
          <button class="btn btn-small" id="try">Open</button>
        </div>
      </div>
      <div id="world" hidden>
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <div style="font-weight:500">Prove you're a real human</div>
            <div class="small muted" id="worldHow">Scan with World App. Nothing about who you are is shared — only that you're a unique human.</div>
          </div>
          <canvas id="qr" width="132" height="132" style="border-radius:8px;background:#fff"></canvas>
        </div>
        <div class="row" style="margin-top:8px;flex-wrap:wrap">
          <button class="btn btn-small" id="sim" hidden>Use World ID simulator (staging demo)</button>
          <button class="btn btn-ghost btn-small" id="cancelWorld">Cancel</button>
        </div>
      </div>
      <button class="btn btn-small" id="verifyHuman" hidden style="margin-top:8px">Verify with World ID</button>
      <div class="small muted" id="identity" hidden>Named-people posts open with your lortnoc identity — coming with the identity update.</div>
    </div>
    <div id="out" hidden>
      <div class="small" id="author" hidden style="margin-bottom:6px"></div>
      <div class="plain" id="plain"></div>
      <button class="btn btn-ghost btn-small" id="ban" hidden style="margin-top:8px"></button>
      <div class="small muted" id="note" style="margin-top:8px"></div>
    </div>
  </div>
  <script type="module" src="./reveal.ts"></script>
</body>
</html>
