<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lortnoc tahc — write</title>
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="title">lortnoc <b>tahc</b></div>
      <button class="x" id="close" title="Close (Esc)">×</button>
    </div>

    <textarea id="msg" placeholder="What you really want to say…" autofocus></textarea>

    <div class="row" style="margin-top:10px">
      <span class="small muted" style="white-space:nowrap">Who can read it</span>
      <select id="who" style="flex:1"></select>
    </div>
    <div id="detail" style="margin-top:8px"></div>
    <div id="custom" hidden style="margin-top:8px">
      <div id="groups"></div>
      <button class="btn btn-ghost btn-small" id="addGroup">+ add requirement</button>
    </div>
    <div class="small muted" id="honesty" style="margin-top:8px"></div>

    <div class="row end" style="margin-top:12px">
      <button class="btn" id="go">Hide &amp; insert</button>
    </div>
    <div class="status" id="status"></div>
    <div id="result" hidden>
      <div class="cover" id="cover"></div>
      <div class="row end" style="margin-top:8px"><button class="btn btn-ghost btn-small" id="copy">Copy</button><button class="btn btn-small" id="insert">Insert</button></div>
    </div>
  </div>
  <script type="module" src="./sheet.ts"></script>
</body>
</html>
