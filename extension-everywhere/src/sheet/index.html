<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lortnoc tahc</title>
  <link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
  <div class="card">
    <div class="hdr">
      <div class="title">lortnoc <b>tahc</b></div>
      <button class="x" id="close" title="Close (Esc)" aria-label="Close"><i data-icon="x"></i></button>
    </div>

    <textarea id="msg" placeholder="What you really want to say" autofocus></textarea>

    <div class="small muted" style="margin:12px 0 6px">Who can read it</div>
    <div class="row">
      <select id="who" style="flex:1;min-width:0"></select>
      <button class="btn btn-ghost btn-small" id="edit" title="Combine rules: this OR that, AND something else">Edit rules</button>
    </div>
    <div id="detail" style="margin-top:8px"></div>
    <div id="custom" hidden style="margin-top:8px">
      <div id="groups"></div>
    </div>
    <div class="small muted" id="honesty" style="margin-top:10px"></div>

    <div class="row end" style="margin-top:14px">
      <button class="btn" id="go"><i data-icon="lock"></i>Hide &amp; insert</button>
    </div>
    <div class="status" id="status"></div>
    <div id="result" hidden>
      <div class="cover" id="cover"></div>
      <div class="row end" style="margin-top:8px"><button class="btn btn-ghost btn-small" id="copy"><i data-icon="copy"></i>Copy</button><button class="btn btn-small" id="insert">Insert</button></div>
    </div>
  </div>
  <script type="module" src="./sheet.ts"></script>
</body>
</html>
