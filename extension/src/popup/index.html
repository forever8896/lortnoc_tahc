<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lortnoc tahc</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="hdr">
      <div class="brand">
        <img class="logo" src="/icons/on-48.png" alt="" />
        <span class="wordmark">lortnoc<span class="dot">·</span>tahc</span>
      </div>
      <span id="status" class="chip chip-off"><i class="led"></i>codec</span>
    </header>

    <!-- master switch -->
    <button id="masterSwitch" class="master" data-on="false" aria-pressed="false">
      <div class="master__l">
        <div class="master__label">Stego</div>
        <div id="masterSub" class="master__sub">off · sending normally</div>
      </div>
      <div class="switch"><div class="knob"></div></div>
    </button>

    <!-- session -->
    <section class="card">
      <div class="card__head">
        <span class="eyebrow">Private session</span>
        <span id="hsStatus" class="chip chip-off">not connected</span>
      </div>
      <button id="connect" class="btn">🤝&nbsp; Connect securely</button>
      <p class="hint">No passphrase. Both sides just need the extension + Stego on — one clicks connect, the other taps Accept. Keys are exchanged invisibly through the chat.</p>
    </section>

    <details class="adv">
      <summary>Advanced</summary>
      <label class="field">
        <span class="eyebrow">Codec URL</span>
        <input type="text" id="codecUrl" spellcheck="false" placeholder="https://lortnoc-codec.fly.dev" />
      </label>
      <label class="field">
        <span class="eyebrow">Shared passphrase <em>(fallback)</em></span>
        <input type="password" id="passphrase" autocomplete="off" spellcheck="false" placeholder="only if not using Connect" />
      </label>
      <div class="actions">
        <button id="save" class="btn btn--sm">Save</button>
        <button id="check" class="btn btn--ghost btn--sm">Check codec</button>
      </div>
    </details>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
