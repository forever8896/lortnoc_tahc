[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Sepolia — ENS v2, pinned deployment tag sepolia-deployment-2026-09-15
# Fork tests (test/*.fork.t.sol) run only when FORK_RPC is set.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
