name: release-extension-everywhere

# lortnoc tahc Everywhere (extension-everywhere/), released the same verifiable way as the Telegram
# and X builds: GitHub's CI builds it from the tagged commit, packages dist/, records a SHA-256 and a
# build-provenance attestation, and publishes both. lortnoctahc.com/everywhere links here.
#
# Tags are `ew-v*` (e.g. ew-v0.2.0) — they match neither release.yml (`v*`) nor release-x.yml
# (`x-v*`). Published with --latest=false: /releases/latest belongs to the Telegram build.

on:
  push:
    tags: ['ew-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. ew-v0.2.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension-everywhere/package-lock.json

      # extension-everywhere/src imports shared/ by relative path (and reads app/src/lib/live/*.json).
      - name: Install workspaces
        run: |
          npm ci --prefix shared
          npm ci --prefix extension-everywhere

      - name: Build the extension
        working-directory: extension-everywhere
        run: npm run build

      - name: Resolve tag
        id: v
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package dist/ + checksum
        id: pkg
        run: |
          ZIP="lortnoc-tahc-everywhere-${{ steps.v.outputs.tag }}.zip"
          ( cd extension-everywhere/dist && zip -r "../../$ZIP" . )
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$ZIP.sha256")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # lortnoc tahc Everywhere ${{ steps.v.outputs.tag }}

          Hide what you write inside what you write — on any page, readable only by who you choose.
          Built in public CI from this tagged commit — verify, don't trust.

          **SHA-256** \`${{ steps.pkg.outputs.zip }}\`
          \`\`\`
          ${{ steps.pkg.outputs.sha }}
          \`\`\`

          ## Install
          1. Download \`${{ steps.pkg.outputs.zip }}\` below and check its SHA-256 matches the value above.
          2. Unzip it somewhere permanent, open \`chrome://extensions\`, turn on **Developer mode**.
          3. Click **Load unpacked** and pick the unzipped folder. Pin it; open ⚙ to add your keys.

          Guide, and how World ID and ENS v2 are integrated (with commands to verify it yourself):
          https://lortnoctahc.com/everywhere

          ## Verify it yourself
          \`\`\`
          git checkout ${{ steps.v.outputs.tag }}
          npm ci --prefix shared
          npm ci --prefix extension-everywhere && npm run --prefix extension-everywhere build
          \`\`\`
          Build-provenance attestation: \`gh attestation verify ${{ steps.pkg.outputs.zip }} -R ${{ github.repository }}\`
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --title "lortnoc tahc Everywhere $TAG" --notes-file RELEASE_NOTES.md --latest=false
          fi
